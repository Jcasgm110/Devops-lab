name: CI
on: push
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correr o Script
        run: |
          chmod +x ola.sh
          ./ola.sh
      - name: Construir a imagem Docker
        run: docker build -t ola-lab .
      - name: Correr o contentor
        run: docker run --rm ola-lab
      - name: Construir a app
        run: docker build -t app-lab ./app
      - name: Testar a app com Compose
        run: |
          cp .env.example .env
          docker compose up -d --build
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:5000
          docker compose down -v
  publicar:
    needs: teste
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar
        run: |
          docker build -t ghcr.io/jcasgm110/app-lab:latest ./app
          docker push ghcr.io/jcasgm110/app-lab:latest
