   name: CI
   on: push
   jobs:
     teste:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Correr o Script
           run: |
             chmod +x ola.sh
             ./ola.sh
         - name: Construir a imagem Docker
           run: docker build -t ola-lab .
         - name: Correr o contentor
           run: docker run --rm ola-lab
         - name: Construir a app
           run: docker build -t app-lab ./app
         - name: Testar a app
           run: |
              docker run -d --rm -p 5000:5000 --name app app-lab
              sleep 3
              curl --fail http://localhost:5000
              docker stop app
