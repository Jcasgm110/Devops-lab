   name: CI
   on: push
   jobs:
     teste:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Correr o Script
           run: |
             chmod +x ola.sh
             ./ola.sh
         - name: Construir a imagem Docker
           run: docker build -t ola-lab .
         - name: Correr o contentor
           run: docker run --rm ola-lab
